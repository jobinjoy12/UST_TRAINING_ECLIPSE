server.port=8080

# H2 Database Configuration (in-memory for demo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:bookdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop # create-drop will drop and create tables on startup, good for dev
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# To use MySQL/PostgreSQL, uncomment and configure below, and remove H2 dependencies from pom.xml
# spring.datasource.url=jdbc:mysql://localhost:3306/your_database_name
# spring.datasource.username=your_username
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Springdoc OpenAPI (Swagger) Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.example.bookmanager.controller
springdoc.show-actuator=true

# Custom OpenAPI Info
springdoc.info.title=Book Manager API
springdoc.info.version=1.0
springdoc.info.description=API for managing book entities with pagination and sorting.
springdoc.info.contact.name=CodeLab
springdoc.info.contact.url=https://codelab.example.com
springdoc.info.license.name=Apache 2.0
springdoc.info.license.url=https://www.apache.org/licenses/LICENSE-2.0.html
