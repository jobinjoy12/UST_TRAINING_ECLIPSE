# Configure your database connection here.
# Choose either MySQL or PostgreSQL configuration by uncommenting the relevant lines.

# --- MySQL Configuration Example ---
spring.datasource.url=jdbc:mysql://localhost:3306/product_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=your_mysql_user
spring.datasource.password=your_mysql_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- PostgreSQL Configuration Example (Uncomment and modify if you choose PostgreSQL) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/product_db
# spring.datasource.username=your_postgres_user
# spring.datasource.password=your_postgres_password
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server port (optional)
server.port=8080
